# bindgen.toml — everything a regeneration of `raylib` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `raylib.dado`; every other byte of that file is hand-written and stays — the
# prose above and below the block, and the `link` clauses with their `when`
# chains.
#
# **The enum namespaces are inside the block and the generator writes them**,
# as `foreign enum`s whose members carry the names `[types.enum_prefix]` below
# derives. They were hand-written under the `declarations` region until CP-1b,
# on the argument that a rename out of raylib's `KEY_*`/`MOUSE_BUTTON_*`
# spelling was nothing a generator could produce; a prefix strip is exactly that
# rename, stated as a rule, so the argument no longer holds and the block no
# longer has an exception in it.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `raylib.h` drafts 661 declarations: 600 functions, 40 structs and 21 enums.
# This binding wants 658 of them — the whole header — and names every one
# below, so the allowlist is still the review it always was: a raylib that adds
# a function adds nothing here until somebody puts its name in a section.
# The sections mirror `raylib.h`'s own module comments (rcore, rgestures,
# rcamera, rshapes, rtextures, rtext, rmodels, raudio) and its sub-headings
# inside each, so a reader can see where a name belongs and whether a new one
# belongs anywhere.
#
# **The three not named are aliases, and each is a second restatement of a
# struct the binding already declares.** `typedef Vector4 Quaternion;`,
# `typedef Texture TextureCubemap;` and `typedef Camera3D Camera;` each draft a
# full `type` block of their own, because Dado has no type alias: a binding
# naming them would declare `Quaternion` and `Vector4` as two distinct Dado
# types over one C struct, and since libclang reports the struct tag at every
# use site, every signature would still say `Vector4` — `Transform.rotation`,
# `LoadTextureCubemap`'s return, `UpdateCamera`'s pointer — and a `Camera`
# value could be passed to none of them. So the alias is left out and the
# struct is named once, under the name the prototypes use: `Vector4`,
# `Texture2D` (by the `Texture` rename below, as before), and `Camera3D`.

[binding]
package        = "raylib"
header         = "raylib.h"
include        = "raylib.h"
std            = "c11"
clang_args     = []
merge          = true

# Three, measured: `raylib.h` has three declarations bindgen cannot translate,
# all of them about C's varargs, and all three are named in the allowlist so the
# skip appendix at the foot of `raylib.dado`'s block says so with the reason:
#
#   * `TraceLog(int logLevel, const char *text, ...)` and
#     `TextFormat(const char *text, ...)` are variadic, and a variadic function
#     cannot cross the C boundary (TOY0099) — Dado has no `...` to restate one
#     with. A program formats with `core:fmt` and logs with `core:log`.
#   * `SetTraceLogCallback(TraceLogCallback callback)` is not variadic itself,
#     but its callback's third parameter is a `va_list`, which has no Dado
#     spelling (ERR0401): it names a type clang's builtin headers declare and
#     this binding never does.
#
# The other four callback typedefs — `LoadFileDataCallback`,
# `SaveFileDataCallback`, `LoadFileTextCallback`, `SaveFileTextCallback` — and
# `AudioCallback` are not declarations of their own: the generator writes a
# function-pointer typedef inline, as a Dado function type, at each parameter
# that takes one, so `SetLoadFileDataCallback` and its three siblings,
# `SetAudioStreamCallback` and the four audio-processor functions are bound in
# full. A count other than three means the header moved
# under a declaration this binding wants.
expect_skipped = 3

