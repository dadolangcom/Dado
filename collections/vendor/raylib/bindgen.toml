# The parameters raylib declares `int` (or `unsigned int`) and documents as one
# of its enums. Each is written as the binding's `foreign enum` rather than as
# `i32`, so `IsKeyDown(key.A)` needs no conversion and a mouse button cannot be
# passed where a key goes. The header keeps saying `int`, and that is what the
# `_Generic` assertion over each signature accepts: a `foreign enum` at a
# parameter is checked as the enum or as its backing, `#c.int` here.
#
# **The two flag enums are mapped too, and OR-ing them needs nothing.**
# `config_flags` and `gesture` are bit flags, and a `foreign enum`'s `|` is the
# enum's own — `SetConfigFlags(config_flags.VSYNC_HINT |
# config_flags.WINDOW_RESIZABLE)` checks and emits `FLAG_VSYNC_HINT |
# FLAG_WINDOW_RESIZABLE`, measured — so a flags parameter takes the enum like
# any other. Those six parameters are `unsigned int` in the header, not `int`,
# and the assertion accepts the enum there because C makes an enum with no
# negative enumerator compatible with `unsigned int` on both gcc and clang; it
# is the enum arm of the assertion that passes, not the `#c.int` one.
#
# Keyed by the header's own parameter name. A return is never here — a mapping
# is a parameter's, and `GetKeyPressed`, `GetGamepadButtonPressed` and
# `GetGestureDetected` answer the header's integer. So are struct members:
# `Image.format`, `Texture2D.format`, `Camera3D.projection` and
# `NPatchInfo.layout` are `i32`, because a layout restates the header's types
# exactly. `SetShaderValue`'s `locIndex` is not `shader_location_index`: it is
# whatever `GetShaderLocation` answered, not an index into the enum.
[declarations.param_enums]
# rcore: window and logging
IsWindowState           = { flag = "config_flags" }
SetWindowState          = { flags = "config_flags" }
ClearWindowState        = { flags = "config_flags" }
SetConfigFlags          = { flags = "config_flags" }
SetTraceLogLevel        = { logLevel = "trace_log_level" }
# rcore: drawing and shaders
BeginBlendMode          = { mode = "blend_mode" }
SetShaderValue          = { uniformType = "shader_uniform_data_type" }
SetShaderValueV         = { uniformType = "shader_uniform_data_type" }
# rcore: input
IsKeyPressed            = { key = "key" }
IsKeyPressedRepeat      = { key = "key" }
IsKeyDown               = { key = "key" }
IsKeyReleased           = { key = "key" }
IsKeyUp                 = { key = "key" }
GetKeyName              = { key = "key" }
SetExitKey              = { key = "key" }
IsGamepadButtonPressed  = { button = "gamepad_button" }
IsGamepadButtonDown     = { button = "gamepad_button" }
IsGamepadButtonReleased = { button = "gamepad_button" }
IsGamepadButtonUp       = { button = "gamepad_button" }
GetGamepadAxisMovement  = { axis = "gamepad_axis" }
IsMouseButtonPressed    = { button = "mouse_button" }
IsMouseButtonDown       = { button = "mouse_button" }
IsMouseButtonReleased   = { button = "mouse_button" }
IsMouseButtonUp         = { button = "mouse_button" }
SetMouseCursor          = { cursor = "mouse_cursor" }
# rgestures and rcamera
SetGesturesEnabled      = { flags = "gesture" }
IsGestureDetected       = { gesture = "gesture" }
UpdateCamera            = { mode = "camera_mode" }
# rtextures
LoadImageRaw            = { format = "pixel_format" }
ImageFormat             = { newFormat = "pixel_format" }
LoadTextureCubemap      = { layout = "cubemap_layout" }
SetTextureFilter        = { filter = "texture_filter" }
SetTextureWrap          = { wrap = "texture_wrap" }
GetPixelColor           = { format = "pixel_format" }
SetPixelColor           = { format = "pixel_format" }
GetPixelDataSize        = { format = "pixel_format" }
# rtext and rmodels
LoadFontData            = { type = "font_type" }
SetMaterialTexture      = { mapType = "material_map_index" }

[types]
opaque = []

# `raylib.h` declares `struct Texture` and then aliases it: `typedef Texture
# Texture2D;`. libclang reports the struct tag at every use site, so a raw
# draft writes `Texture` in every signature that takes one AND emits identical
# restatements of the same struct (`Texture`, `Texture2D`, `TextureCubemap`).
# Naming the alias here collapses those to one declaration under the name
# raylib's own documentation and this binding's callers use. `RenderTexture` is
# the same shape of aliasing. (`TextureCubemap`, `Quaternion` and `Camera` are
# the aliases the allowlist leaves out; its header comment says why.)
[types.rename]
"Texture"       = "Texture2D"
"RenderTexture" = "RenderTexture2D"

# The enums are renamed for a different reason: raylib names its enum types in
# CamelCase and its enumerators with a SHOUTING copy of the same word
# (`KeyboardKey` / `KEY_A`), and this binding spells the pair `key.A` — the
# namespace carries the noun so the member does not have to. The
# `@c("KeyboardKey")` the generator writes on each declaration is what keeps
# C's own name for `sizeof` and for every prototype.
#
# The rule is the C name in snake_case, which is what `MouseButton` →
# `mouse_button` always was; `key` is the one older exception and stays, since
# `key.A` is what every program here already writes.
"ConfigFlags"             = "config_flags"
"TraceLogLevel"           = "trace_log_level"
"KeyboardKey"             = "key"
"MouseButton"             = "mouse_button"
"MouseCursor"             = "mouse_cursor"
"GamepadButton"           = "gamepad_button"
"GamepadAxis"             = "gamepad_axis"
"MaterialMapIndex"        = "material_map_index"
"ShaderLocationIndex"     = "shader_location_index"
"ShaderUniformDataType"   = "shader_uniform_data_type"
"ShaderAttributeDataType" = "shader_attribute_data_type"
"PixelFormat"             = "pixel_format"
"TextureFilter"           = "texture_filter"
"TextureWrap"             = "texture_wrap"
"CubemapLayout"           = "cubemap_layout"
"FontType"                = "font_type"
"BlendMode"               = "blend_mode"
"Gesture"                 = "gesture"
"CameraMode"              = "camera_mode"
"CameraProjection"        = "camera_projection"
"NPatchLayout"            = "npatch_layout"

# And the enumerators are renamed by RULE rather than one line each, which is
# the whole difference between these and `vendor:enet`'s three: raylib prefixes
# every enumerator of an enum with one string, so stripping it is derivable
# where enet's CamelCase was not. These 21 lines carry all 305
# enumerators of the 21 enums, and every one of them is stripped: that many
# lines of config would say nothing 21 do. `camera_mode` and
# `camera_projection` share raylib's `CAMERA_` prefix, and the strip is per
# enum, so `camera_mode.FREE` and `camera_projection.PERSPECTIVE` do not meet.
#
# **A member the strip leaves unwritable would need a `[types.enum_members]`
# line and there is none, which is a measurement rather than an assumption**:
# no enumerator of these 21 strips down to a leading digit or to a Dado keyword
# — `KEY_KP_0` is `KP_0`, `KEY_F1` is `F1`, `PIXELFORMAT_COMPRESSED_ASTC_4x4_RGBA`
# is `COMPRESSED_ASTC_4x4_RGBA`, all of which open with a letter, and Dado's
# keywords are lower-case where every stripped name is upper. An entry that
# stripped nothing at all is reported by `Generator.unmatched_enum_prefixes` and
# is red in `scripts/bindings.py`, so a raylib that renames its convention
# cannot pass here quietly.
[types.enum_prefix]
"config_flags"               = "FLAG_"
"trace_log_level"            = "LOG_"
"key"                        = "KEY_"
"mouse_button"               = "MOUSE_BUTTON_"
"mouse_cursor"               = "MOUSE_CURSOR_"
"gamepad_button"             = "GAMEPAD_BUTTON_"
"gamepad_axis"               = "GAMEPAD_AXIS_"
"material_map_index"         = "MATERIAL_MAP_"
"shader_location_index"      = "SHADER_LOC_"
"shader_uniform_data_type"   = "SHADER_UNIFORM_"
"shader_attribute_data_type" = "SHADER_ATTRIB_"
"pixel_format"               = "PIXELFORMAT_"
"texture_filter"             = "TEXTURE_FILTER_"
"texture_wrap"               = "TEXTURE_WRAP_"
"cubemap_layout"             = "CUBEMAP_LAYOUT_"
"font_type"                  = "FONT_"
"blend_mode"                 = "BLEND_"
"gesture"                    = "GESTURE_"
"camera_mode"                = "CAMERA_"
"camera_projection"          = "CAMERA_"
"npatch_layout"              = "NPATCH_"
