# bindgen.toml — everything a regeneration of `raylib` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `raylib.dado`; every other byte of that file is hand-written and stays — the
# prose above and below the block, and the `link` clauses with their `when`
# chains.
#
# **The `key`/`mouse_*`/`gamepad_*`/`texture_*` namespaces are inside the block
# and the generator writes them**, as `foreign enum`s whose members carry the
# names `[types.enum_prefix]` below derives. They were hand-written under the
# `declarations` region until CP-1b, on the argument that a rename out of
# raylib's `KEY_*`/`MOUSE_BUTTON_*` spelling was nothing a generator could
# produce; a prefix strip is exactly that rename, stated as a rule, so the
# argument no longer holds and the block no longer has an exception in it.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `raylib.h` drafts 660 declarations. This binding wants the 163 below — "the
# parts of raylib a game reaches for" — and the section comments are the
# curation's own, kept so a reader can see which group a name belongs to and
# whether a new one belongs in any of them.

[binding]
package        = "raylib"
header         = "raylib.h"
include        = "raylib.h"
std            = "c11"
clang_args     = []
merge          = true

# Zero. `raylib.h` has three declarations bindgen cannot translate — `TraceLog`
# and `TextFormat` are variadic, and `SetTraceLogCallback` takes a `va_list` —
# and none of the three is in the allowlist, so all three are excluded rather
# than skipped. A skip appearing here means the header moved under a
# declaration this binding does want.
expect_skipped = 0

[declarations]
mode = "allow"
allow = [
    # Window & state
    "InitWindow",
    "CloseWindow",
    "WindowShouldClose",
    "IsWindowReady",
    "IsWindowFullscreen",
    "IsWindowHidden",
    "IsWindowMinimized",
    "IsWindowMaximized",
    "IsWindowFocused",
    "IsWindowResized",
    "ToggleFullscreen",
    "ToggleBorderlessWindowed",
    "MaximizeWindow",
    "MinimizeWindow",
    "RestoreWindow",
    "SetWindowTitle",
    "SetWindowPosition",
    "SetWindowSize",
    "SetWindowMinSize",
    "SetWindowMaxSize",
    "SetWindowOpacity",
    "SetTargetFPS",
    "GetFPS",
    "GetFrameTime",
    "GetTime",
    "GetScreenWidth",
    "GetScreenHeight",
    "GetRenderWidth",
    "GetRenderHeight",
    "GetWindowPosition",
    "GetWindowScaleDPI",
    "SetClipboardText",
    "GetClipboardText",
    "ShowCursor",
    "HideCursor",
    "IsCursorHidden",
    "EnableCursor",
    "DisableCursor",
    "IsCursorOnScreen",

    # The frame
    "BeginDrawing",
    "EndDrawing",
    "BeginMode2D",
    "EndMode2D",
    "BeginScissorMode",
    "EndScissorMode",
    "ClearBackground",

    # Data structures
    "Color",
    "Vector2",
    "Vector3",
    "Vector4",
    "Rectangle",
    "Camera2D",
    "Texture2D",
    "RenderTexture2D",

    # Colour helpers
    "Fade",
