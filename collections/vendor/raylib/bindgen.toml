    # Shapes: filled
    "DrawPixel",
    "DrawPixelV",
    "DrawCircle",
    "DrawCircleV",
    "DrawRectangle",
    "DrawRectangleV",
    "DrawRectangleRec",
    "DrawPoly",
    "DrawTriangle",

    # Shapes: outlines
    "DrawLine",
    "DrawLineV",
    "DrawLineEx",
    "DrawLineBezier",
    "DrawLineDashed",
    "DrawCircleLines",
    "DrawCircleLinesV",
    "DrawRectangleLines",
    "DrawTriangleLines",
    "DrawPolyLines",
    "DrawPolyLinesEx",
    "DrawEllipse",
    "DrawEllipseV",
    "DrawEllipseLines",
    "DrawEllipseLinesV",
    "DrawRectanglePro",
    "DrawRectangleGradientV",
    "DrawRectangleGradientH",
    "DrawRectangleGradientEx",
    "DrawRectangleLinesEx",
    "DrawRectangleRounded",
    "DrawRectangleRoundedLines",
    "DrawRectangleRoundedLinesEx",

    # Text
    "DrawFPS",
    "DrawText",
    "MeasureText",

    # Textures
    "LoadTexture",
    "IsTextureValid",
    "UnloadTexture",
    "LoadRenderTexture",
    "IsRenderTextureValid",
    "UnloadRenderTexture",
    "SetTextureFilter",
    "SetTextureWrap",
    "DrawTexture",
    "DrawTextureV",
    "DrawTextureEx",
    "DrawTextureRec",
    "DrawTexturePro",

    # Input: keyboard
    "IsKeyPressed",
    "IsKeyPressedRepeat",
    "IsKeyDown",
    "IsKeyReleased",
    "IsKeyUp",
    "GetKeyPressed",
    "GetCharPressed",
    "GetKeyName",
    "SetExitKey",

    # Input: mouse
    "IsMouseButtonPressed",
    "IsMouseButtonDown",
    "IsMouseButtonReleased",
    "IsMouseButtonUp",
    "GetMouseX",
    "GetMouseY",
    "GetMousePosition",
    "GetMouseDelta",
    "SetMousePosition",
    "SetMouseOffset",
    "SetMouseScale",
    "GetMouseWheelMove",
    "GetMouseWheelMoveV",
    "SetMouseCursor",

    # Input: gamepad
    "IsGamepadAvailable",
    "GetGamepadName",
    "IsGamepadButtonPressed",
    "IsGamepadButtonDown",
    "IsGamepadButtonReleased",
    "IsGamepadButtonUp",
    "GetGamepadButtonPressed",
    "GetGamepadAxisCount",
    "GetGamepadAxisMovement",
    "SetGamepadVibration",

    # Random
    "SetRandomSeed",
    "GetRandomValue",

    # Collision (2D)
    "CheckCollisionRecs",
    "CheckCollisionCircles",
    "CheckCollisionCircleRec",
    "CheckCollisionCircleLine",
    "CheckCollisionPointRec",
    "CheckCollisionPointCircle",
    "CheckCollisionPointTriangle",
    "CheckCollisionPointLine",
    "GetCollisionRec",

    # The seven public enums, under the Dado names `[types.rename]` gives them.
    # They were a hand-written block below this file's `declarations` region
    # until CP-1b, with 151 values transcribed out of `raylib.h` and compared
    # to it by nothing.
    "key",
    "mouse_button",
    "mouse_cursor",
    "gamepad_button",
    "gamepad_axis",
    "texture_filter",
    "texture_wrap",
]

# The parameters raylib declares `int` and documents as one of its enums.
# Each is written as the binding's `foreign enum` rather than as
# `i32`, so `IsKeyDown(key.A)` needs no conversion and a mouse button cannot be
# passed where a key goes. The header keeps saying `int`, and that is what the
# `_Generic` assertion over each signature accepts: a `foreign enum` at a
# parameter is checked as the enum or as its backing, `#c.int` here.
#
# Keyed by the header's own parameter name. `GetKeyPressed` and
# `GetGamepadButtonPressed` return one of these as an `int` too and are not
# here: a mapping is a parameter's, and a return is left as the header's
# integer.
[declarations.param_enums]
IsKeyPressed            = { key = "key" }
IsKeyPressedRepeat      = { key = "key" }
IsKeyDown               = { key = "key" }
IsKeyReleased           = { key = "key" }
IsKeyUp                 = { key = "key" }
GetKeyName              = { key = "key" }
SetExitKey              = { key = "key" }
IsGamepadButtonPressed  = { button = "gamepad_button" }
IsGamepadButtonDown     = { button = "gamepad_button" }
IsGamepadButtonReleased = { button = "gamepad_button" }
IsGamepadButtonUp       = { button = "gamepad_button" }
GetGamepadAxisMovement  = { axis = "gamepad_axis" }
IsMouseButtonPressed    = { button = "mouse_button" }
IsMouseButtonDown       = { button = "mouse_button" }
IsMouseButtonReleased   = { button = "mouse_button" }
IsMouseButtonUp         = { button = "mouse_button" }
SetMouseCursor          = { cursor = "mouse_cursor" }
SetTextureFilter        = { filter = "texture_filter" }
SetTextureWrap          = { wrap = "texture_wrap" }

[types]
opaque = []

# `raylib.h` declares `struct Texture` and then aliases it: `typedef Texture
# Texture2D;`. libclang reports the struct tag at every use site, so a raw
# draft writes `Texture` in 13 signatures AND emits three identical
# restatements of the same struct (`Texture`, `Texture2D`, `TextureCubemap`).
# Naming the alias here collapses those to one declaration under the name
# raylib's own documentation and this binding's callers use. `RenderTexture` is
# the same shape of aliasing.
[types.rename]
"Texture"       = "Texture2D"
"RenderTexture" = "RenderTexture2D"

# The enums are renamed for a different reason: raylib names its enum types in
# CamelCase and its enumerators with a SHOUTING copy of the same word
# (`KeyboardKey` / `KEY_A`), and this binding has always spelled the pair
# `key.A` — the namespace carries the noun so the member does not have to. The
# `@c("KeyboardKey")` the generator writes on each declaration is what keeps
# C's own name for `sizeof` and for every prototype.
"KeyboardKey"   = "key"
"MouseButton"   = "mouse_button"
"MouseCursor"   = "mouse_cursor"
"GamepadButton" = "gamepad_button"
"GamepadAxis"   = "gamepad_axis"
"TextureFilter" = "texture_filter"
"TextureWrap"   = "texture_wrap"

# And the enumerators are renamed by RULE rather than one line each, which is
# the whole difference between these seven and `vendor:enet`'s three: raylib
# prefixes every enumerator of an enum with one string, so stripping it is
# derivable where enet's CamelCase was not. These seven lines carry all 162
# enumerators of the seven enums, and every one of them is stripped: 162 lines
# of config would say nothing seven do.
#
# **A member the strip leaves unwritable would need a `[types.enum_members]`
# line and there is none, which is a measurement rather than an assumption**:
# no enumerator of these seven strips down to a leading digit or to a Dado
# keyword — `KEY_KP_0` is `KP_0` and `KEY_F1` is `F1`, both of which open with
# a letter. An entry that stripped nothing at all is reported by
# `Generator.unmatched_enum_prefixes` and is red in `scripts/bindings.py`, so a
# raylib that renames its convention cannot pass here quietly.
[types.enum_prefix]
"key"            = "KEY_"
"mouse_button"   = "MOUSE_BUTTON_"
"mouse_cursor"   = "MOUSE_CURSOR_"
"gamepad_button" = "GAMEPAD_BUTTON_"
"gamepad_axis"   = "GAMEPAD_AXIS_"
"texture_filter" = "TEXTURE_FILTER_"
"texture_wrap"   = "TEXTURE_WRAP_"
