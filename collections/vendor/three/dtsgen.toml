# dtsgen.toml: what a regeneration of the `three` bindings needs that the
# declarations in @types/three cannot say: which classes and constants are
# bound, and how their members lower.

[binding]
package = "three"
input = "@types/three/src/Three.d.ts"
module = "lib/three.module.js"
runtime = "three_rt.js"
classes = [
    "Object3D", "Scene", "Camera", "PerspectiveCamera", "Mesh", "GridHelper",
    "Light", "DirectionalLight", "HemisphereLight",
    "BufferGeometry", "BoxGeometry", "PlaneGeometry",
    "Material", "MeshStandardMaterial", "MeshBasicMaterial", "ShaderMaterial", "BufferAttribute",
    "WebGLRenderer", "Color", "Vector3", "Euler", "Matrix4",
]
consts = ["PCFShadowMap", "PCFSoftShadowMap", "SRGBColorSpace", "FrontSide", "BackSide", "DoubleSide"]
# Held as `any`: LightShadow's init takes a camera, so no placeholder can adopt one.
opaque = ["WebGLShadowMap", "DirectionalLightShadow"]
expect_skipped = 113

[lower]
int = [
    "Object3D.id", "BufferGeometry.id", "Material.id",
    "BoxGeometry.constructor.widthSegments", "BoxGeometry.constructor.heightSegments",
    "BoxGeometry.constructor.depthSegments",
    "PlaneGeometry.constructor.widthSegments", "PlaneGeometry.constructor.heightSegments",
    "GridHelper.constructor.divisions",
    "Color.setHex.hex", "Color.getHex",
]
skip = ["EventDispatcher.*"]
# Trailing optional parameters left to three's own default (the call stops before them).
omit = ["Color.setHex.colorSpace", "Color.getHex.colorSpace", "Color.getHexString.colorSpace", "Color.getStyle.colorSpace"]

[overloads]
"Color.constructor" = ["", "init"]
"Object3D.lookAt" = ["lookAt", "lookAtXYZ"]

[defaults]
"WebGLRenderer.setSize.updateStyle" = true
"WebGLRenderer.setClearColor.alpha" = 1.0
