# bindgen.toml — everything a regeneration of `sokol_gp` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `sokol_gp.dado`; every other byte of that file is hand-written and stays.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `mode = "all"` here, for the reason every sokol package says it: this package
# vendors the header whole, so there is no curated list to keep in step with it
# and every declaration `sokol_gp.h` writes is wanted.
#
# **An allowlist is not what keeps sokol_gfx's declarations out of this
# package, and it could not be.** The parse below is handed the whole of
# `sokol_gfx.h` — it has to be, see `clang_args` — so libclang sees some 600
# `sg_*` declarations beside this header's 75. What separates them is
# `Generator._in_header`: a declaration is emitted only when its source
# location is the header this binding names, so everything reached through an
# `-include` is read for its types and declared by nobody. That is a property
# of the generator rather than of this file, which is why the split needs no
# configuration at all, and it is the same mechanism `sokol_glue` relies on. An
# allowlist here would restate 75 names in order to change nothing.

[binding]
package = "sokol_gp"
header  = "sokol_gp.h"
include = "sokol_gp.h"
std     = "c11"

# `sokol_gp.h` refuses to be read on its own, in its own words:
#
#     #error "Please include sokol_gfx.h before sokol_gp.h"
#     #error "Please include sokol_gfx.h implementation before sokol_gp.h implementation"
#
# so the parse is given `sokol_gfx.h` force-included, plus the directory it
# lives in. A relative path here is relative to THIS FILE, not to whoever ran
# the generator: the config travels with the binding and a caller's working
# directory is not part of it.
#
# `sokol_app.h` is deliberately absent, which is the one place this binding
# differs from `sokol_glue`'s: glue bridges the window to the swapchain and its
# header names both, while sokol_gp is a painter that draws through sokol_gfx
# and never mentions a window. Force-including a header this one does not
# require would put its declarations in front of the parser for nothing.
clang_args = [
    "-I", "../sokol_gfx",
    "-include", "sokol_gfx.h",
]

merge = true

# Zero. Every one of the 75 declarations `sokol_gp.h` writes translates: the
# widest shapes in it are a union (`sgp_uniform_data`, which crosses as
# `cunion`) and a two-dimensional array member (`sgp_mat2x3.v`, which crosses
# as `[2][3]f32`). A skip appearing here means the header moved.
expect_skipped = 0

[declarations]
mode = "all"

[types]
opaque = []

# The four sokol_gfx handle types this header names. Each is declared by
# `sokol_gfx.h` and reached here through `import "vendor:sokol/sokol_gfx"`, so
# Dado spells them qualified. No parse of `sokol_gp.h` can produce that
# qualifier: libclang sees one translation unit and knows nothing of Dado
# packages, so the mapping is stated rather than derived.
#
# **The list is exactly the sokol_gfx types that reach this binding's surface,
# and the two that do not appear here are the reason to say so.**
# `sokol_gp.h` also writes `sg_pixel_format` and `sg_primitive_type`, and both
# are C enums rather than structs. A foreign enum the binding does not itself
# declare crosses as its backing integer — `Mapper._map_core`'s enum arm falls
# back to `decl.enum_type` and never consults `[types.rename]` — so those three
# slots (`sgp_desc.color_format`, `sgp_desc.depth_format`,
# `sgp_pipeline_desc.primitive_type`) and `sgp_draw`'s first parameter come
# through as `u32`. A value of the enum still crosses; only the grouped name is
# missing, and a caller writes
# `u32(sokol_gfx.sg_pixel_format.SG_PIXELFORMAT_RGBA8)` — the enum's own name is
# part of the spelling, as `example/drawsmoke` writes it. This line said
# `u32(sokol_gfx.SG_PIXELFORMAT_RGBA8)` until 2026-09-19, which is ERR0408:
# a workaround for a lost enum name that omitted the enum name. Entries
# for the two are NOT written below, because a `[types.rename]` that matches
# nothing is reported by nothing — unlike an allowlist entry or a parameter
# name list, which `scripts/bindings.py` reads off stderr — so dead entries
# here would rot in silence and read as if they were doing the work.
#
# `sg_image` used to be in this list and is not any more. The local port of
# `sokol_gp.h` to the views API moved the painter's public texture surface from
# images to views — `sgp_set_view(int, sg_view)` and
# `sgp_textures_uniform.views[]` — so `sg_image` no longer reaches this
# binding and `sg_view` does. By the rule stated just above, the entry moved
# rather than being added alongside: a rename that matches nothing is reported
# by nothing.
[types.rename]
"sg_view"     = "sokol_gfx.sg_view"
"sg_sampler"  = "sokol_gfx.sg_sampler"
"sg_shader"   = "sokol_gfx.sg_shader"
"sg_pipeline" = "sokol_gfx.sg_pipeline"
