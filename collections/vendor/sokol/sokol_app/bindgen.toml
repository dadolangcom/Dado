# bindgen.toml — everything a regeneration of `sokol_app` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `sokol_app.dado`; every other byte of that file is hand-written and stays.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `mode = "all"` here: this package vendors the header whole, so there is no
# curated list to keep in step with it and every declaration is wanted.

[binding]
package        = "sokol_app"
header         = "sokol_app.h"
include        = "sokol_app.h"
std            = "c11"
clang_args     = []
merge          = true
expect_skipped = 0

[declarations]
mode = "all"
