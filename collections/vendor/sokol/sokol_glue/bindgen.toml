# bindgen.toml — everything a regeneration of `sokol_glue` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `sokol_glue.dado`; every other byte of that file is hand-written and stays.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `mode = "all"` here: this header declares two functions and the package wants
# both.

[binding]
package = "sokol_glue"
header  = "sokol_glue.h"
include = "sokol_glue.h"
std     = "c11"

# `sokol_glue.h` refuses to be read on its own, in its own words:
#
#     #error "Please include sokol_gfx.h before sokol_glue.h"
#     #error "Please include sokol_app.h before the sokol_glue.h implementation"
#
# so the parse is given both, force-included, plus the two directories they
# live in. A relative path here is relative to THIS FILE, not to whoever ran
# the generator: the config travels with the binding and a caller's working
# directory is not part of it.
clang_args = [
    "-I", "../sokol_gfx",
    "-I", "../sokol_app",
    "-include", "sokol_gfx.h",
    "-include", "sokol_app.h",
]

merge          = true
expect_skipped = 0

[declarations]
mode = "all"

[types]
opaque = []

# `sg_environment` and `sg_swapchain` are declared by `sokol_gfx.h` and reached
# here through `import "vendor:sokol/sokol_gfx"`, so Dado spells them qualified.
# No parse of `sokol_glue.h` can produce that qualifier: libclang sees one
# translation unit and knows nothing of Dado packages, so the mapping is stated
# rather than derived.
[types.rename]
"sg_environment" = "sokol_gfx.sg_environment"
"sg_swapchain"   = "sokol_gfx.sg_swapchain"
