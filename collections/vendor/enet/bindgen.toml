# bindgen.toml — everything a regeneration of `enet` needs that the header
# cannot say. Dado's binding generator reads it
# and rewrites only the two `bindgen:begin`/`bindgen:end` regions of
# `enet.dado`; every other byte of that file is hand-written and stays — the
# prose above and below the block, the `InAddr` declaration above the
# `declarations` marker, the two `private foreign` libc blocks, the wrappers,
# and the `when #OS == #WINDOWS` link clause.
#
# **`ENetEventType`, `ENetPacketFlag` and `ENetPeerState` are in the allowlist
# below and bindgen writes all three**, into `enet.dado`'s `declarations` region
# with everything else. Each crosses as a `foreign enum`: Dado declares the
# enumerator NAMES and C supplies every value, so no number in that file was
# read off `enet.h` by a human. Two things decide how they read and both are
# stated further down — `[types.rename]` drops the `ENet` the package name
# already carries, and `[types.enum_members]` gives each enumerator the
# CamelCase spelling this tree's callers write (`PeerState.Zombie` for
# `ENET_PEER_STATE_ZOMBIE`). Both are matched against `enet.h` on every
# regeneration, so an enumerator ENet renames or drops is a line in
# `scripts/bindings.py`'s output rather than a silent no-op.
#
# They were hand-written inside `enet.dado`'s `foreign` block, above the
# `declarations` begin marker, until CP-1b, and the gap that kept them there
# was real: a C enum crossing as a `foreign enum` rather than as a Dado `enum`
# of transcribed numbers changes what the generator emits for **every** binding
# it has already written, and a per-member rename was something no config key
# could ask for. Both were built for all eleven bindings at once, which is why
# this file no longer makes an exception of three enums.
#
# **The declaration filter is an allowlist, not a denylist, because an
# allowlist ages safely: a header that grows adds nothing to this binding until
# someone names it here, whereas a denylist admits every declaration upstream
# invents next and the binding silently grows a surface nobody reviewed.**
#
# `enet.h` drafts 192 declarations. This binding wants 43 of them: the public
# API under the header's own "Public API" banner, the five types it passes
# around, and the three public enums. Everything else is ENet's internal
# protocol/command/list machinery and its raw BSD-socket layer — unreachable
# from outside `enet.c`'s own translation unit, so a binding for it is dead
# surface a caller could misuse.

[binding]
package        = "enet"
header         = "enet.h"
include        = "enet.h"
std            = "c11"
# The generator reads `enet.h` in the mode the binding is built in, which is
# the mode `enet.c` compiles in and the mode `enet.dado`'s `foreign` line asks
# for with `define "ENET_IPV4_ONLY=1"`. Without it `ENetAddress` is restated
# off the wrong arm of the header's own `#ifdef ENET_IPV4_ONLY`: dual stack
# gives it a 16-byte `struct in6_addr host` and 20 bytes total, IPv4-only a
# 4-byte `struct in_addr host` and 8. The generator and the two other
# translation units agreeing is what makes `dado_assert__sizeof__ENetAddress`
# a check rather than a coincidence.
clang_args     = ["-DENET_IPV4_ONLY=1"]
merge          = true

# Zero. `_ENetProtocol` and the five structs that hold one by value are all
# outside the allowlist, so they are excluded rather than skipped and owe
# nobody an answer. A skip appearing here means `enet.h` moved under a
# declaration this binding does want.
#
# **The union is excluded by choice and no longer by capability.** Until CP-5
# it was also unspellable — a C union had no by-value form — and the draft
# skipped it and the five structs with it. `cunion` gives it one, and bindgen
# now writes `cunion @c("union _ENetProtocol") …` for a tag with no typedef.
# It stays out of the allowlist for the reason every other internal
# declaration does: it is ENet's own protocol machinery, reachable from
# nothing outside `enet.c`, and a binding for it is dead surface a caller
# could misuse.
expect_skipped = 0

[declarations]
mode = "allow"
allow = [
    # Handles, declared with no body by [types.opaque] below.
    "ENetHost",
    "ENetPeer",
    "ENetPacket",

    # Restated transparently, member for member. Neither is a handle: a caller
    # builds an `ENetAddress` and reads an `ENetEvent`, which is what the
    # deleted `enet_shim.{h,c}` existed to do on Dado's behalf.
    "ENetAddress",
    "ENetEvent",

    # The three public enums, under their Dado names — `[types.rename]` below
    # drops the `ENet` that the package name already says, and
    # `[types.enum_members]` gives each enumerator the CamelCase spelling
    # callers write. They were a hand-written `foreign enum` block in
    # `enet.dado` until CP-1b; nothing in the names changed, only who writes
    # them.
    "EventType",
    "PacketFlag",
    "PeerState",

    # Address. Both resolve a name into an `ENetAddress` a caller owns; they
    # are ordinary externs and the `enet_address_set_host`/`_get_host` spellings
    # beside them in the header are object-like macros onto these two.
    "enet_address_set_host_new",
    "enet_address_get_host_new",

    # Library lifecycle.
    "enet_initialize",
    "enet_deinitialize",
    "enet_linked_version",
    "enet_time_get",

    # Host.
    "enet_host_create",
    "enet_host_destroy",
    "enet_host_connect",
    "enet_host_check_events",
    "enet_host_service",
    "enet_host_flush",
    "enet_host_broadcast",
    "enet_host_channel_limit",
    "enet_host_bandwidth_limit",
    "enet_host_get_peers_count",
    "enet_host_get_packets_sent",
    "enet_host_get_packets_received",
    "enet_host_get_bytes_sent",
    "enet_host_get_bytes_received",

    # Peer.
    "enet_peer_send",
    "enet_peer_receive",
    "enet_peer_ping",
    "enet_peer_reset",
    "enet_peer_disconnect",
    "enet_peer_disconnect_now",
    "enet_peer_disconnect_later",
    "enet_peer_get_state",
    "enet_peer_get_rtt",
    "enet_peer_get_data",
    "enet_peer_set_data",

    # Packet.
    "enet_packet_create",
    "enet_packet_destroy",
    "enet_packet_get_data",
    "enet_packet_get_length",
]

# Parameter names, because `enet.h` does not write any.
#
# C lets a prototype name only its types, and this header almost always does:
#
#     ENET_API ENetHost * enet_host_create (const ENetAddress *, size_t,
#                                           size_t, enet_uint32, enet_uint32);
#
# libclang then reports every parameter's spelling as the empty string, and
# bindgen's honest fallback is `a0, a1, a2, a3, a4` — which type-checks exactly
# as well and tells a reader of this binding nothing at all. `channelLimit` and
# `incomingBandwidth` are not derivable from the header; they are ENet's
# documentation, read out of its prose and its `.c`, and they are the reason
# anyone can use `enet_host_create` without opening upstream. So they are
# hand-written **here**, in the hand-written half, rather than hand-patched
# into the generated half where the next regeneration would erase them.
#
# Each list describes one exact signature. If its length disagrees with the
# header's, bindgen refuses by name (`[declarations.params]: `enet_host_create`
# is given 5 parameter name(s) but takes 6 …`) rather than truncating or
# padding: a config that has gone stale because upstream grew an argument must
# not keep producing a binding that reads as though someone checked it.
#
# The four functions that take none — `enet_initialize`, `enet_deinitialize`,
# `enet_linked_version`, `enet_time_get` — are absent, having nothing to name.
[declarations.params]
enet_address_set_host_new      = ["address", "hostName"]
enet_address_get_host_new      = ["address", "hostName", "nameLength"]
enet_host_create               = ["address", "peerCount", "channelLimit", "incomingBandwidth", "outgoingBandwidth"]
enet_host_destroy              = ["host"]
enet_host_connect              = ["host", "address", "channelCount", "data"]
enet_host_check_events         = ["host", "event"]
enet_host_service              = ["host", "event", "timeout"]
enet_host_flush                = ["host"]
enet_host_broadcast            = ["host", "channelID", "packet"]
enet_host_channel_limit        = ["host", "channelLimit"]
enet_host_bandwidth_limit      = ["host", "incomingBandwidth", "outgoingBandwidth"]
enet_host_get_peers_count      = ["host"]
enet_host_get_packets_sent     = ["host"]
enet_host_get_packets_received = ["host"]
enet_host_get_bytes_sent       = ["host"]
enet_host_get_bytes_received   = ["host"]
enet_peer_send                 = ["peer", "channelID", "packet"]
enet_peer_receive              = ["peer", "channelID"]
enet_peer_ping                 = ["peer"]
enet_peer_reset                = ["peer"]
enet_peer_disconnect           = ["peer", "data"]
enet_peer_disconnect_now       = ["peer", "data"]
enet_peer_disconnect_later     = ["peer", "data"]
enet_peer_get_state            = ["peer"]
enet_peer_get_rtt              = ["peer"]
enet_peer_get_data             = ["peer"]
enet_peer_set_data             = ["peer", "data"]
enet_packet_create             = ["data", "dataLength", "flags"]
enet_packet_destroy            = ["packet"]
enet_packet_get_data           = ["packet"]
enet_packet_get_length         = ["packet"]

[types]
# Handles. Each of these is reached only by pointer, through the accessors
# `enet.h` provides (`enet_host_get_peers_count`, `enet_peer_get_state`, …),
# and ENet's own header says as much of `ENetPeer`: "No fields should be
# modified unless otherwise specified". A body-less `type` in a `foreign` block
# is exactly that — an address with a name and no layout — so this is the
# correct binding and not a workaround. Without it bindgen restates
# `ENetHost`/`ENetPeer`/`ENetPacket` field for field: `ENetHost` holds an
# `ENetProtocol` union by value, which until CP-5 had no Dado spelling and made
# the whole struct unspellable, and which `cunion` now spells. What the entry
# buys is unchanged and is not a capability — it is the layout nobody here
# reviewed staying out of this binding, and `enet_host_create` returning a
# named handle rather than a restatement of ENet's internals.
#
# **`ENetAddress` and `ENetEvent` were in this list and are not any more, and
# the two that left are the whole of why `enet_shim.h`/`.c` are gone.** Neither
# is a handle: a caller fills in an address and reads an event, so opaque cost
# fifteen hand-written C accessors to give back what a transparent restatement
# gives for nothing. `ENetEvent`'s member named `type` is spelled `@c("type")
# type_`, as `sapp_event.type` is in `vendor:sokol`; `ENetAddress`'s member is
# `struct in_addr`, restated by hand as `InAddr` above the `declarations`
# marker in `enet.dado` because it is `<netinet/in.h>`'s declaration and not
# this header's — `[types.rename]` below is what binds the two spellings
# together. A transparent restatement emits `sizeof`/`offsetof` assertions, so
# the layout is now checked by the C compiler on every build instead of being
# reached only through C the Dado side could not see into.
opaque = [
    "ENetHost",
    "ENetPeer",
    "ENetPacket",
]

# libclang reports the struct TAG at a use site — `^_ENetAddress` — where every
# prototype in the header and every caller in this tree writes the typedef.
# The tag is an implementation detail of how the header declares the type; the
# typedef is the name.
[types.rename]
"_ENetHost"    = "ENetHost"
"_ENetPeer"    = "ENetPeer"
"_ENetPacket"  = "ENetPacket"
"_ENetAddress" = "ENetAddress"
"_ENetEvent"   = "ENetEvent"

# `ENetAddress.host` is a `struct in_addr`, which is `<netinet/in.h>`'s and not
# `enet.h`'s, so it is outside this binding's allowlist and bindgen writes no
# declaration for it — naming it in `allow` would be an entry matching nothing,
# which `scripts/bindings.py` reads as red. This line only says which Dado name
# the generated member reaches it by; the declaration it reaches is
# `type @c("struct in_addr") InAddr: (u32 s_addr)`, hand-written above the
# `declarations` marker in `enet.dado`.
"in_addr"      = "InAddr"

# The enums are renamed for a different reason: not to pick the typedef over
# the tag, but to drop a prefix the package name already carries. A caller
# writes `enet.PeerState.Zombie`, and `enet.ENetPeerState.…` would say ENet
# twice. `@c("ENetPeerState")` on the emitted declaration keeps C's own name,
# which is what `sizeof` and every prototype reach the type by.
"ENetEventType"  = "EventType"
"ENetPacketFlag" = "PacketFlag"
"ENetPeerState"  = "PeerState"

# The enumerators, one line each, because CamelCase is not derivable from
# `ENET_PEER_STATE_ACKNOWLEDGING_CONNECT` by any rule — a prefix strip gets as
# far as `ACKNOWLEDGING_CONNECT` and no further. These spellings are the ones
# `enet.dado` carried by hand before CP-1b and the ones `net.dado`, `enet.dado`
# and `enet_test.dado` are written in; each `@c` in the generated file is the C
# name beside it, so a renamed enumerator upstream is `cc`'s error by name.
[types.enum_members.EventType]
"ENET_EVENT_TYPE_NONE"               = "None"
"ENET_EVENT_TYPE_CONNECT"            = "Connect"
"ENET_EVENT_TYPE_DISCONNECT"         = "Disconnect"
"ENET_EVENT_TYPE_RECEIVE"            = "Receive"
"ENET_EVENT_TYPE_DISCONNECT_TIMEOUT" = "DisconnectTimeout"

[types.enum_members.PacketFlag]
"ENET_PACKET_FLAG_RELIABLE"            = "Reliable"
"ENET_PACKET_FLAG_UNSEQUENCED"         = "Unsequenced"
"ENET_PACKET_FLAG_NO_ALLOCATE"         = "NoAllocate"
"ENET_PACKET_FLAG_UNRELIABLE_FRAGMENT" = "UnreliableFragment"
"ENET_PACKET_FLAG_UNTHROTTLED"         = "Unthrottled"
"ENET_PACKET_FLAG_SENT"                = "Sent"

[types.enum_members.PeerState]
"ENET_PEER_STATE_DISCONNECTED"             = "Disconnected"
"ENET_PEER_STATE_CONNECTING"               = "Connecting"
"ENET_PEER_STATE_ACKNOWLEDGING_CONNECT"    = "AcknowledgingConnect"
"ENET_PEER_STATE_CONNECTION_PENDING"       = "ConnectionPending"
"ENET_PEER_STATE_CONNECTION_SUCCEEDED"     = "ConnectionSucceeded"
"ENET_PEER_STATE_CONNECTED"                = "Connected"
"ENET_PEER_STATE_DISCONNECT_LATER"         = "DisconnectLater"
"ENET_PEER_STATE_DISCONNECTING"            = "Disconnecting"
"ENET_PEER_STATE_ACKNOWLEDGING_DISCONNECT" = "AcknowledgingDisconnect"
"ENET_PEER_STATE_ZOMBIE"                   = "Zombie"
